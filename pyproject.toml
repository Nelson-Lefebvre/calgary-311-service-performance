[project]
name = "calgary-311-service-performance"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "requests>=2.34.2",
    "dbt-duckdb>=1.11.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "tableauhyperapi>=0.0.26963",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
